name: Deploy to GitHub Pages
# Manual only: a Pages site is public, and data/opportunities.json is a private contact list.
# Run it from the Actions tab only if you have decided to publish (see README > Privacy first).
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data and regenerate data/opportunities.js
        run: node scripts/build-data.mjs
      - name: Fail if the committed data/opportunities.js is stale
        run: git diff --exit-code -- data/opportunities.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
